name: Workers validation
on:
  push:
    paths:
      - 'workers/**'
      - 'file-metadata/**'
      - 'file-types/**'
      - '.github/workflows/workers.yaml'
    branches:
      - main
  pull_request:
    paths:
      - 'workers/**'
      - 'file-metadata/**'
      - 'file-types/**'
      - '.github/workflows/workers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
      - run: echo './file-types' './workers' './file-metadata' | xargs -n1 cp ./.npmrc
      - run: docker compose run --rm -w /root/file-types node npm ci
      - run: docker compose run --rm -w /root/file-types node npm run ci
      - run: docker compose run --rm -w /root/file-types node npm run test
      - run: docker compose run --rm -w /root/workers node npm ci
      - run: docker compose run --rm -w /root/workers node npm run ci
      - run: docker compose run --rm -w /root/workers node npm run test
      - run: docker compose run --rm -w /root/file-metadata node npm ci
      - run: docker compose run --rm -w /root/file-metadata node npm run ci
      - run: docker compose run --rm -w /root/file-metadata node npm run test

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1" # v2.5.0
    permissions:
      contents: read
      actions: read
      security-events: write

  publish-worker:
    if: ${{ github.event_name == 'push' }}
    needs:
      - test
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/deploy-workers.yaml'
    with:
      branch: ${{ github.event_name == 'push' && 'main' || github.head_ref || 'preview' }}
    secrets: inherit

  update-content:
    if: ${{ github.event_name == 'push' }}
    needs:
      - test
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/update-content.yaml'
    secrets: inherit
