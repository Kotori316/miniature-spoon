# https://google.github.io/osv-scanner/github-action
name: OSV Scanner
on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 3 * * 2'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1" # v2.5.0
