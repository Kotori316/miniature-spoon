# https://google.github.io/osv-scanner/github-action
name: OSV Scanner
on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 3 * * 2'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
