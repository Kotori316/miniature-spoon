# https://google.github.io/osv-scanner/github-action
name: OSV Scanner
on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 3 * * 2'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
